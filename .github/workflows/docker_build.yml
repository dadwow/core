name: docker-build
on:
  push:
    branches:
      - 'Playerbot'
      - 'master'
  pull_request:
    types:
      - labeled
      - synchronize
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref_name }}, ${{ github.workflow }})
  cancel-in-progress: true

env:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/dadwow/pluscraft
  RUNNING_ON_PRIMARY_BRANCH: |
    ${{ (github.repository == 'dadwow/core' && (github.ref_name == 'Playerbot' || github.ref_name == 'master')) && 'true' || 'false' }}

jobs:
  build-containers:
    runs-on: "ubuntu-latest"
    if: |
      github.repository == 'dadwow/core'
      && !github.event.pull_request.draft
      && (github.ref_name == 'Playerbot' || github.ref_name == 'master' || contains(github.event.pull_request.labels.*.name, 'run-build') || github.event.label.name == 'run-build')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: env.RUNNING_ON_PRIMARY_BRANCH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          version="$(jq -r '.version' acore.json)"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build worldserver
        uses: ./.github/actions/docker-tag-and-build
        with:
          component-name: worldserver
          version: ${{ steps.version.outputs.version }}
          push: ${{ env.RUNNING_ON_PRIMARY_BRANCH }}

      - name: build authserver
        uses: ./.github/actions/docker-tag-and-build
        with:
          component-name: authserver
          version: ${{ steps.version.outputs.version }}
          push: ${{ env.RUNNING_ON_PRIMARY_BRANCH }}

      - name: build db-import
        uses: ./.github/actions/docker-tag-and-build
        with:
          component-name: db-import
          version: ${{ steps.version.outputs.version }}
          push: ${{ env.RUNNING_ON_PRIMARY_BRANCH }}

      - name: build client-data
        uses: ./.github/actions/docker-tag-and-build
        with:
          component-name: client-data
          version: ${{ steps.version.outputs.version }}
          push: ${{ env.RUNNING_ON_PRIMARY_BRANCH }}

      - name: build tools
        uses: ./.github/actions/docker-tag-and-build
        with:
          component-name: tools
          version: ${{ steps.version.outputs.version }}
          push: ${{ env.RUNNING_ON_PRIMARY_BRANCH }}

      - name: build dev-server
        uses: ./.github/actions/docker-tag-and-build
        with:
          component-name: dev
          version: ${{ steps.version.outputs.version }}
          push: ${{ env.RUNNING_ON_PRIMARY_BRANCH }}
          dockerfile: apps/docker/Dockerfile.dev-server
