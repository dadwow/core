name: nopch-module-build
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'src/*'
      - 'src/common/**/*'
      - 'src/genrev/**/*'
      - 'src/server/*'
      - 'src/server/apps/**/*'
      - 'src/server/database/**/*'
      - 'src/server/game/**/*'
      - 'src/server/shared/**/*'
      - 'src/tools/**/*'

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref_name }}, ${{ github.workflow }})
  cancel-in-progress: true

jobs:
  build-modules:
    runs-on: ubuntu-22.04
    name: ubuntu-22.04-clang-nopch-modules
    if: github.repository == 'dadwow/core' && !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        # This script installs a general list of modules to compile with
        # azerothcore. This is useful for ensuring that module compilation
        # functionality works.
      - name: Checkout modules
        run: bash -x ./apps/ci/ci-install-modules.sh
      - uses: ./.github/actions/linux-build
        with:
          CC: clang
          CXX: clang++
          modules: true
          pch: false
          maxerrors: 0
          keepgoing: true
