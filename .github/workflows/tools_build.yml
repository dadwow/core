name: tools
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - labeled
      - synchronize

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref_name }}, ${{ github.workflow }})
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    name: ubuntu-22.04-clang-tools
    if: |
      github.repository == 'dadwow/core' && !github.event.pull_request.draft
      && (
        contains(github.event.pull_request.labels.*.name, 'run-build')
        || github.event.label.name == 'run-build'
      )
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-build
        with:
          CC: clang
          CXX: clang++
          tools: all
          pch: false
